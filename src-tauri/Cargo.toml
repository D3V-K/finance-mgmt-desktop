[package]
name = "finance-mgmt-desktop"
version = "0.1.0"
description = "Single-user offline finance desktop application"
authors = ["D3V-K"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "finance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-single-instance = "2"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.17"
